apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleettwin-backend
  labels:
    app.kubernetes.io/name: fleettwin-backend
    app.kubernetes.io/part-of: fleettwin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleettwin-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleettwin-backend
        app.kubernetes.io/part-of: fleettwin
    spec:
      containers:
        - name: backend
          image: ghcr.io/hemanth-008/fleettwin-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fleettwin-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fleettwin-secrets
                  key: JWT_SECRET
            - name: TELEMETRY_KEY
              valueFrom:
                secretKeyRef:
                  name: fleettwin-secrets
                  key: TELEMETRY_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fleettwin-backend
  labels:
    app.kubernetes.io/name: fleettwin-backend
    app.kubernetes.io/part-of: fleettwin
spec:
  selector:
    app.kubernetes.io/name: fleettwin-backend
  ports:
    - name: http
      port: 8000
      targetPort: http

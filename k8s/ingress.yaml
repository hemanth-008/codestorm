apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleettwin
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: fleettwin.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fleettwin-backend
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: fleettwin-backend
                port:
                  name: http
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: fleettwin-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleettwin-frontend
                port:
                  name: http
    # Replace the example host and TLS secret before production use.
  tls:
    - hosts:
        - fleettwin.example.com
      secretName: fleettwin-tls

services:
  - type: web
    name: fleettwin-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AUTH_ENABLED
        value: "0"
      - key: SIM_ENABLED
        value: "1"
      - key: SIM_SPEED
        value: "1.0"
      - key: CORS_ORIGINS
        value: https://fleettwin-frontend.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: TELEMETRY_KEY
        sync: false

  - type: web
    name: fleettwin-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_USE_MOCK
        value: "0"
      - key: VITE_API_URL
        value: https://fleettwin-backend.onrender.com
